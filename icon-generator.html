<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembuat ikon Field Operations</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="login-shell"><section class="login-card"><h1>Ikon aplikasi</h1><p>Unduh empat PNG ini dan simpan ke folder icons dengan nama yang tertera.</p><canvas id="preview" width="192" height="192" aria-label="Pratinjau ikon"></canvas><div id="buttons" class="actions"></div></section></main><script>
const files=[['icon-192.png',192,false],['icon-512.png',512,false],['maskable-512.png',512,true],['apple-touch-icon.png',180,false]];
function draw(canvas,size,maskable){canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#bf4d24';ctx.fillRect(0,0,size,size);const scale=size/64,margin=maskable?6:0;ctx.save();ctx.translate(size/2,size/2);const safe=(64-margin*2)/64;ctx.scale(scale*safe,scale*safe);ctx.translate(-32,-32);ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(18,46);ctx.lineTo(18,18);ctx.lineTo(46,18);ctx.moveTo(18,32);ctx.lineTo(39,32);ctx.moveTo(18,46);ctx.lineTo(32,46);ctx.stroke();ctx.restore();}
draw(document.getElementById('preview'),192,false);for(const [name,size,mask]of files){const b=document.createElement('button');b.textContent='Unduh '+name;b.onclick=()=>{const c=document.createElement('canvas');draw(c,size,mask);c.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);},'image/png');};document.getElementById('buttons').append(b);}
</script></body></html>
