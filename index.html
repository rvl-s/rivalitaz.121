<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bf4d24">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Field Ops">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdnjs.cloudflare.com https://tile.openstreetmap.org; font-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Field Operations</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Langsung ke isi</a>
  <section id="login-view" class="login-shell">
    <div class="login-card">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#bf4d24"/><path d="M18 18h28M18 32h21M18 46h14M18 18v28" stroke="#fff" stroke-width="6" fill="none"/></svg>
      <h1>Field Operations</h1><p>Masuk dengan akun kerja Anda.</p>
      <form id="login-form">
        <label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="60"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary" type="submit">Masuk</button>
      </form>
      <p id="startup" role="status">Menyiapkan aplikasi</p>
      <button id="install-login" class="install" type="button" hidden>Pasang aplikasi</button>
    </div>
  </section>
  <div id="app" hidden>
    <header class="app-header"><strong>Field Operations</strong><span id="identity"></span><div class="header-actions"><span id="network-status" role="status"></span><button id="install-app" class="install" hidden type="button">Pasang</button><button id="password-button" type="button">Password</button><button id="logout-button" type="button">Keluar</button></div></header>
    <nav id="navigation" aria-label="Menu utama"></nav>
    <div id="map" hidden aria-label="Peta lokasi SPG"></div>
    <main id="content" tabindex="-1"><section id="work-view" class="view" hidden></section><section id="dash-view" class="view" hidden></section><section id="customers-view" class="view" hidden></section><section id="visits-view" class="view" hidden></section><section id="alerts-view" class="view" hidden></section><section id="manage-view" class="view" hidden></section><section id="audit-view" class="view" hidden></section><section id="queue-view" class="view" hidden></section></main>
    <footer class="status-bar"><span id="location-status">Belum check-in</span><button id="queue-status" type="button">Antrean 0</button><span id="app-version"></span></footer>
  </div>
  <dialog id="dialog" aria-label="Formulir"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Aplikasi memerlukan JavaScript. Aktifkan JavaScript pada Chrome atau Safari.</noscript>
</body>
</html>
